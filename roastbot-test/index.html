<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roast Bot Test</title>
<meta name="robots" content="noindex">
<style>
:root { color-scheme: dark; --night: #0a0b10; --line: #30333f; --ink: #ebe8e1; --body: #d4d1ca; --dim: #9c9ba5; --faint: #6d6e79; --gold: #d9b26f; --green: #6be39a; --you: #6bc4e3; --mono: "JetBrains Mono", "Fira Code", Consolas, monospace; }
body { margin: 0; background: var(--night); color: var(--body); font: 400 13.5px/1.6 var(--mono); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.term { max-width: 1000px; margin: 0 auto; border: 1px solid var(--line); border-radius: 8px; background: #07080c; overflow: hidden; }
.bar { padding: 10px 14px; border-bottom: 1px solid var(--line); background: #0d0e14; color: var(--faint); font-size: 12.5px; }
.body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.body p { margin: 0; }
.ps { color: var(--green); } .cmd { color: var(--ink); } .cm { color: var(--faint); }
.status { color: var(--dim); min-height: 1.6em; white-space: pre-wrap; }
.log { display: flex; flex-direction: column; gap: 8px; min-height: 220px; max-height: 60vh; overflow-y: auto; padding: 12px 14px; background: #000; border: 1px dashed #2a2c36; overflow-wrap: anywhere; }
.log p { white-space: pre-wrap; }
.log .you b { color: var(--you); font-weight: 400; } .log .bot b { color: var(--gold); font-weight: 400; } .log .meta { color: var(--faint); font-size: 12px; }
form { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; background: #0d0e14; }
form:focus-within { border-color: var(--green); }
label { color: var(--you); }
input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); font: 400 16px/1.4 var(--mono); }
.tb { appearance: none; background: none; border: 0; padding: 4px 0; font: inherit; color: var(--ink); cursor: pointer; }
.tb::before { content: "[ "; color: var(--faint); } .tb::after { content: " ]"; color: var(--faint); }
.tb:hover { color: var(--green); } .tb:disabled { color: var(--faint); cursor: default; }
</style>
</head>
<body>
<div class="term">
  <div class="bar">finnfreas.com: ~/roastbot-test</div>
  <div class="body">
    <p><span class="ps">$</span> <span class="cmd">./chat.sh --device your-browser</span></p>
    <p class="cm" id="note"># test page, not linked from the site. each visit picks a random seed, like ./chat.sh --seed random. add ?seed=N to the address to pick one.</p>
    <p class="cm" id="seed"></p>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <label for="input">you&gt;</label>
      <input id="input" type="text" maxlength="280" placeholder="say something" enterkeyhint="send" disabled>
      <button type="submit" class="tb" id="send" disabled>send</button>
    </form>
    <div><button type="button" class="tb" id="reset">/reset</button></div>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), status = $("status"), form = $("form"), input = $("input"), send = $("send");
  const q = new URLSearchParams(location.search).get("seed");
  const seed = q != null && q !== "" && !isNaN(+q) ? +q : null;
  let ready = false, busy = false;
  const line = (cls, who, text) => {
    const p = document.createElement("p");
    p.className = cls;
    if (who) { const b = document.createElement("b"); b.textContent = who + "> "; p.append(b); }
    p.append(document.createTextNode(text));
    log.append(p);
    log.scrollTop = log.scrollHeight;
  };
  const setBusy = (v) => { busy = v; input.disabled = send.disabled = !ready || v; if (!v && ready) input.focus(); };
  status.textContent = "> loading the model…";
  const worker = new Worker("../roastbot/roastbot-worker.js");
  worker.onmessage = ({ data: m }) => {
    if (m.type === "progress") status.textContent = `> loading the model… ${Math.round(m.frac * 100)}%`;
    else if (m.type === "ready") { ready = true; $("seed").textContent = `seed ${m.seed}: replay this chat with ./chat.sh --seed ${m.seed}`; status.textContent = "> model loaded. say something."; setBusy(false); }
    else if (m.type === "reply") {
      m.texts.forEach((t) => line("bot", "roast bot", t));
      line("meta", "", `  [${m.tokens} tokens, ${(m.ms / 1000).toFixed(1)} s in your browser]`);
      status.textContent = "";
      setBusy(false);
    } else if (m.type === "reset") { log.textContent = ""; status.textContent = "> conversation cleared."; setBusy(false); }
    else if (m.type === "error") { status.textContent = "error: " + m.message; setBusy(false); }
  };
  worker.onerror = () => { status.textContent = "error: the worker couldn't start. open this page through http://localhost, not as a file."; };
  worker.postMessage({ type: "init", seed });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !ready || busy) return;
    line("you", "you", text);
    input.value = "";
    status.textContent = "> roast bot is typing…";
    setBusy(true);
    worker.postMessage({ type: "say", text });
  });
  $("reset").addEventListener("click", () => { if (ready && !busy) { setBusy(true); worker.postMessage({ type: "reset" }); } });
})();
</script>
</body>
</html>
